<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦Your Mind✦ — Gedanken visualisieren</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #ff5774;
    --accent2: #ff6b6b;
    --accent3: #57d4ff;
    --text: #f0f0f0;
    --text-muted: #666;
    --toolbar-h: 62px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* ── TOOLBAR ── */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--toolbar-h);
    background: rgba(14,14,14,0.96);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 16px;
    z-index: 1000;
    overflow-x: auto;
  }
  #toolbar::-webkit-scrollbar { display: none; }

  .tb-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: -0.5px;
    margin-right: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tb-sep {
    width: 1px;
    height: 32px;
    background: var(--border);
    margin: 0 8px;
    flex-shrink: 0;
  }

  .tb-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .tb-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tb-btn:hover { background: var(--surface2); border-color: #444; }
  .tb-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .tb-btn.danger { border-color: var(--accent2); color: var(--accent2); }
  .tb-btn.danger:hover { background: rgba(255,107,107,0.12); }

  .shape-btn {
    width: 34px; height: 34px;
    padding: 0;
    font-size: 14px;
  }
  .shape-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .tb-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
    flex-shrink: 0;
  }

  .tb-input-num {
    width: 52px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 8px;
    outline: none;
    text-align: center;
    flex-shrink: 0;
  }

  .color-swatch {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 2px solid var(--border);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    transition: border-color 0.15s;
  }
  .color-swatch:hover { border-color: #555; }
  .color-swatch input[type=color] {
    position: absolute;
    top: -4px; left: -4px;
    width: 140%; height: 140%;
    opacity: 0;
    cursor: pointer;
  }
  .color-swatch-preview {
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ── CANVAS AREA ── */
  #canvas-wrap {
    position: fixed;
    top: var(--toolbar-h);
    left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: #080808;
    background-image:
      radial-gradient(circle at 20% 50%, rgba(200,255,87,0.02) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(87,212,255,0.025) 0%, transparent 40%),
      radial-gradient(circle at 60% 80%, rgba(255,107,107,0.02) 0%, transparent 40%);
  }

  /* dot grid */
  #canvas-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #232323 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  #canvas {
    position: absolute;
    width: 4000px;
    height: 3000px;
    transform-origin: 0 0;
  }

  svg#lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  .wavy-line {
  fill: none;
  stroke-width: 5; /* Breitere Trefferzone für Klicks */
  stroke-linecap: round;
  opacity: 0.75;
  pointer-events: stroke; /* Erlaubt Klicks NUR auf der Linie */
  cursor: pointer;
  transition: stroke-width 0.2s, stroke 0.2s;
  }

  .wavy-line:hover {
  stroke-width: 8;
  stroke: #ff6b6b !important; /* Visuelles Feedback beim Hover */
  }

  /* ── NODES ── */
  .node {
    position: absolute;
    cursor: grab;
    transition: filter 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .node:active { cursor: grabbing; }
  .node.dragging { z-index: 500; filter: drop-shadow(0 8px 32px rgba(0,0,0,0.8)); }

  .node-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 130px;
    min-height: 70px;
    cursor: inherit;
    transition: transform 0.15s;
  }
  .node:hover .node-inner { transform: scale(1.03); }

  .node-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .node-text {
    position: relative;
    z-index: 2;
    outline: none;
    text-align: center;
    word-break: break-word;
    max-width: 220px;
    min-width: 40px;
    line-height: 1.3;
    cursor: text;
    padding: 2px;
  }

  /* shapes via clip-path / border-radius on node-bg */
  .node-bg.rect { border-radius: 10px; }
  .node-bg.rounded { border-radius: 50px; }
  .node-bg.oval { border-radius: 50%; }
  .node-bg.diamond {
    transform: rotate(45deg);
    border-radius: 6px;
  }
  .node-bg.heart {
    clip-path: url(#heart-clip);
  }
  .node-bg.star {
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .node-bg.hexagon {
    clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0% 50%);
  }
  .node-bg.cloud {
    border-radius: 50px;
    box-shadow: inset 0 0 0 0 transparent;
  }

  .node.done .node-text {
    text-decoration: line-through;
    opacity: 0.6;
  }
  .node.done .node-bg {
    filter: brightness(0.45) saturate(0.3);
  }

  /* center node */
  .node.center-node .node-inner { cursor: default; }
  .node.center-node { z-index: 10; }

  /* ── NODE CONTROLS ── */
  .node-controls {
    position: absolute;
    top: -38px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 4px;
    background: rgba(14,14,14,0.95);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 6px;
    z-index: 600;
    white-space: nowrap;
  }
  .node:hover .node-controls,
  .node-controls:hover { display: flex; }

  .nc-btn {
    width: 24px; height: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .nc-btn:hover { background: #333; border-color: #555; }
  .nc-btn.del:hover { background: rgba(255,107,107,0.2); border-color: var(--accent2); color: var(--accent2); }

  /* ── ADD BUTTON ── */
  #add-btn {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 56px; height: 56px;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    color: #000;
    font-size: 26px;
    cursor: pointer;
    z-index: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 24px rgba(200,255,87,0.3);
    transition: all 0.2s;
    font-weight: 300;
  }
  #add-btn:hover { transform: scale(1.08); box-shadow: 0 6px 32px rgba(200,255,87,0.45); }

  /* ── COLOR PICKER POPUP ── */
  #color-popup {
    position: fixed;
    background: rgba(14,14,14,0.98);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    z-index: 2000;
    display: none;
    min-width: 220px;
    box-shadow: 0 16px 64px rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
  }
  #color-popup.visible { display: block; }
  #color-popup h4 { font-family: 'Syne', sans-serif; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

  .color-wheel-wrap {
    position: relative;
    margin-bottom: 10px;
  }
  .color-wheel-wrap input[type=color] {
    width: 100%;
    height: 100px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: none;
  }

  .hex-row {
    display: flex; gap: 6px; align-items: center;
  }
  .hex-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    letter-spacing: 1px;
  }
  .hex-apply {
    padding: 6px 12px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #000;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
  }

  .presets {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .preset-dot {
    width: 22px; height: 22px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.12s;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .preset-dot:hover { transform: scale(1.2); }

  /* ── WAVY LINES ── */
  .wavy-line {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    opacity: 0.75;
  }

  /* ── HINT ── */
  #hint {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14,14,14,0.9);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-muted);
    pointer-events: none;
    transition: opacity 0.5s;
    z-index: 800;
  }
  #hint.hidden { opacity: 0; }

  /* ── TASK MODE INDICATOR ── */
  #task-badge {
    position: fixed;
    top: calc(var(--toolbar-h) + 12px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent2);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
    z-index: 900;
    letter-spacing: 0.5px;
    display: none;
    font-family: 'Syne', sans-serif;
  }
  #task-badge.visible { display: block; }
</style>
</head>
<body>

<!-- SVG defs for heart clip -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
      <path d="M0.5,0.9 C0.5,0.9 0.05,0.55 0.05,0.3 C0.05,0.12 0.2,0.05 0.35,0.1 C0.42,0.13 0.47,0.18 0.5,0.25 C0.53,0.18 0.58,0.13 0.65,0.1 C0.8,0.05 0.95,0.12 0.95,0.3 C0.95,0.55 0.5,0.9 0.5,0.9 Z"/>
    </clipPath>
  </defs>
</svg>

<!-- TOOLBAR -->
<div id="toolbar">
  <span class="tb-logo">✦ Gedankenverwaltung ✦</span>
  <div class="tb-sep"></div>

  <span class="tb-label">Form</span>
  <button class="tb-btn shape-btn active" data-shape="rounded" title="Oval/Pill">⬭</button>
  <button class="tb-btn shape-btn" data-shape="rect" title="Rechteck">⬜</button>
  <button class="tb-btn shape-btn" data-shape="oval" title="Ellipse">⬤</button>
  <button class="tb-btn shape-btn" data-shape="heart" title="Herz">♥</button>
  <button class="tb-btn shape-btn" data-shape="diamond" title="Raute">◆</button>
  <button class="tb-btn shape-btn" data-shape="star" title="Stern">★</button>
  <button class="tb-btn shape-btn" data-shape="hexagon" title="Hexagon">⬡</button>

  <span class="tb-label">Linienfarbe</span>

  <span class="tb-label">Textfarbe</span>
  <div class="color-swatch" id="swatch-text" title="Textfarbe wählen">

  <div class="tb-sep"></div>

  <input class="tb-input-num" type="number" id="inp-fsize" value="14" min="8" max="48">

  <button class="tb-btn" id="btn-bold" title="Fett" style="font-weight:700;width:34px;padding:0"><b>B</b></button>
  <button class="tb-btn" id="btn-italic" title="Kursiv" style="font-style:italic;width:34px;padding:0"><i>I</i></button>

  <div class="tb-sep"></div>

</div>

<!-- COLOR POPUP -->
<div id="color-popup">
  <h4 id="popup-title">Farbe</h4>
  <div class="color-wheel-wrap">
    <input type="color" id="popup-wheel" value="#ff5774">
  </div>
  <div class="hex-row">
    <input class="hex-input" id="popup-hex" type="text" value="#ff5774" maxlength="7" placeholder="#hex">

<!-- CANVAS -->

  <div id="canvas">
    <svg id="lines"></svg>
  </div>

<!-- ADD BUTTON -->
<button id="add-btn" title="Neuen Knoten hinzufügen">+</button>

<!-- TASK BADGE -->
<div id="task-badge">☑ ERLEDIGT-MODUS AKTIV — Knoten anklicken</div>

<!-- HINT -->
<div id="hint">Doppelklick auf Knoten zum Bearbeiten · Ziehen zum Verschieben</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
const state = {
  nodes: [],
  idCounter: 0,
  shape: 'rounded',
  fillColor: '#ff5774',
  lineColor: '#57d4ff',
  textColor: '#0a0a0a',
  font: "'DM Sans', sans-serif",
  fontSize: 14,
  bold: false,
  italic: false,
  underline: false,
  taskMode: false,
  removeMode: false,
  removeLinkMode: false, 

  panX: 0, panY: 0,
  zoom: 1,
  isPanning: false,
  panStartX: 0, panStartY: 0,
  panOriginX: 0, panOriginY: 0,
  links: [],
  connectMode: false,
  connectSourceId: null,
};

let popupTarget = null;
let dragNode = null;
let dragOffX = 0, dragOffY = 0;

const canvasEl = document.getElementById('canvas');
const canvasWrap = document.getElementById('canvas-wrap');
const linesEl = document.getElementById('lines');
const addBtn = document.getElementById('add-btn');
const taskBadge = document.getElementById('task-badge');
const hint = document.getElementById('hint');

// ════════════════════════════════════════════
//  INITIAL CENTER NODE
// ════════════════════════════════════════════
function init() {
  const vw = canvasWrap.offsetWidth;
  const vh = canvasWrap.offsetHeight;
  const cx = (vw / 2) / state.zoom - state.panX;
  const cy = (vh / 2) / state.zoom - state.panY;

  createNode({
    x: cx - 90, y: cy - 30,
    text: 'Topic',
    shape: 'rounded',
    fill: '#ff5774',
    lineColor: '#ff5774',
    textColor: '#0a0a0a',
    font: "'JetBrains Mono', monospace",
    fontSize: 18,
    bold: true,
    italic: false,
    underline: false,
    isCenter: true,
  });

  setTimeout(() => hint.classList.add('hidden'), 4000);
  updateCanvas();
}
//------------------------------
//save mindmap file
//----------------------------

function getMindmapData() {
  return {
    app: 'organise-ur-brainz',
    version: 1,
    savedAt: new Date().toISOString(),
    state: {
      nodes: state.nodes,
      links: state.links,
      idCounter: state.idCounter,
      shape: state.shape,
      fillColor: state.fillColor,
      lineColor: state.lineColor,
      textColor: state.textColor,
      font: state.font,
      fontSize: state.fontSize,
      bold: state.bold,
      italic: state.italic,
      underline: state.underline,
      panX: state.panX,
      panY: state.panY,
      zoom: state.zoom
    }
  };
}

function downloadMindmapJson() {
  const data = getMindmapData();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);

  const date = new Date().toISOString().slice(0, 10);
  const link = document.createElement('a');
  link.href = url;
  link.download = `mindmap-${date}.json`;
  link.click();

  URL.revokeObjectURL(url);
}

function clearMindmapDom() {
  document.querySelectorAll('.node').forEach(el => el.remove());
  linesEl.innerHTML = '';
}

function loadMindmapData(data) {
  if (!data || !data.state || !Array.isArray(data.state.nodes)) {
    alert('Diese Datei ist keine gültige Mindmap-Datei.');
    return;
  }

  clearMindmapDom();

  state.nodes = [];
  state.links = Array.isArray(data.state.links) ? data.state.links : [];
  state.idCounter = Number(data.state.idCounter) || 0;

  state.shape = data.state.shape || 'rounded';
  state.fillColor = data.state.fillColor || '#ff5774';
  state.lineColor = data.state.lineColor || '#57d4ff';
  state.textColor = data.state.textColor || '#0a0a0a';
  state.font = data.state.font || "'DM Sans', sans-serif";
  state.fontSize = Number(data.state.fontSize) || 14;
  state.bold = !!data.state.bold;
  state.italic = !!data.state.italic;
  state.underline = !!data.state.underline;

  state.panX = Number(data.state.panX) || 0;
  state.panY = Number(data.state.panY) || 0;
  state.zoom = Number(data.state.zoom) || 1;

  data.state.nodes.forEach(node => {
    const restoredNode = {
      id: Number(node.id),
      x: Number(node.x) || 0,
      y: Number(node.y) || 0,
      text: String(node.text || ''),
      shape: node.shape || 'rounded',
      fill: node.fill || '#ff5774',
      lineColor: node.lineColor || '#57d4ff',
      textColor: node.textColor || '#0a0a0a',
      font: node.font || "'DM Sans', sans-serif",
      fontSize: Number(node.fontSize) || 14,
      bold: !!node.bold,
      italic: !!node.italic,
      underline: !!node.underline,
      done: !!node.done,
      isCenter: !!node.isCenter
    };

    state.nodes.push(restoredNode);
    renderNode(restoredNode);
  });

  state.idCounter = Math.max(
    state.idCounter,
    ...state.nodes.map(node => node.id)
  );

  applyTransform();
  updateLines();
}

function loadMindmapJsonFile(file) {
  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      loadMindmapData(data);
    } catch (err) {
      alert('Die Datei konnte nicht gelesen werden.');
      console.error(err);
    }
  };

  reader.readAsText(file);
}

document.getElementById('btn-save-json').addEventListener('click', downloadMindmapJson);

document.getElementById('btn-load-json').addEventListener('click', () => {
  document.getElementById('inp-load-json').click();
});

document.getElementById('inp-load-json').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (state.nodes.length > 0) {
    const ok = confirm('Die aktuelle Mindmap wird ersetzt. Fortfahren?');
    if (!ok) {
      e.target.value = '';
      return;
    }
  }

  loadMindmapJsonFile(file);
  e.target.value = '';
});


// ════════════════════════════════════════════
//  NODE FACTORY
// ════════════════════════════════════════════
function createNode({ x, y, text, shape, fill, lineColor, textColor, font, fontSize, bold, italic, underline, isCenter = false }) {
  const id = ++state.idCounter;
  const node = { id, x, y, text, shape, fill, lineColor, textColor, font, fontSize, bold, italic, underline, done: false, isCenter };
  state.nodes.push(node);
  renderNode(node);
  return node;
}

function renderNode(node) {
  let el = document.getElementById('node-' + node.id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'node' + (node.isCenter ? ' center-node' : '');
    el.id = 'node-' + node.id;
    canvasEl.appendChild(el);

    if (!node.isCenter) {
      const ctrl = document.createElement('div');
      ctrl.className = 'node-controls';
      ctrl.innerHTML = `<button class="nc-btn del" data-id="${node.id}" title="Löschen">✕</button>`;
      ctrl.querySelector('.del').addEventListener('click', (e) => {
        e.stopPropagation();
        removeNode(node.id);
      });
      el.appendChild(ctrl);
    }

    const inner = document.createElement('div');
    inner.className = 'node-inner';
    const bg = document.createElement('div');
    bg.className = 'node-bg ' + node.shape;
    const txt = document.createElement('div');
    txt.className = 'node-text';
    txt.contentEditable = 'true';
    txt.spellcheck = false;
    txt.innerText = node.text;

    inner.appendChild(bg);
    inner.appendChild(txt);
    el.appendChild(inner);

    el.addEventListener('mousedown', onNodeMouseDown);
    txt.addEventListener('focus', (e) => e.stopPropagation());
    txt.addEventListener('blur', () => {
      node.text = txt.innerText;
      updateLines();
    });
    txt.addEventListener('input', () => {
      updateNodeSize(node);
      updateLines();
    });
    
    el.addEventListener('click', (e) => {
      if (state.taskMode && !node.isCenter) {
        node.done = !node.done;
        applyNodeStyle(node);
        updateLines();
      }
      if (state.removeMode && !node.isCenter) {
        e.stopPropagation();
        removeNode(node.id);
      }
      if (state.connectMode) {
        if (!state.connectSourceId) {
          state.connectSourceId = node.id;
          el.style.outline = "2px solid var(--accent)";
        } else {
          if (state.connectSourceId !== node.id) {
            const exists = state.links.some(l => 
              (l.from === state.connectSourceId && l.to === node.id) || 
              (l.from === node.id && l.to === state.connectSourceId)
            );
            if (!exists) {
              state.links.push({ from: state.connectSourceId, to: node.id });
            }
          }
          const oldEl = document.getElementById('node-' + state.connectSourceId);
          if(oldEl) oldEl.style.outline = "";
          state.connectSourceId = null;
          updateLines();
        }
      }
    });
  }

  applyNodeStyle(node);
  updateNodeSize(node);
  positionNode(node);
}

function applyNodeStyle(node) {
  const el = document.getElementById('node-' + node.id);
  if (!el) return;
  const bg = el.querySelector('.node-bg');
  const txt = el.querySelector('.node-text');

  bg.className = 'node-bg ' + node.shape;
  bg.style.background = node.fill;
  bg.style.boxShadow = `0 0 0 1.5px ${hexAlpha(node.fill, 0.4)}, 0 2px 16px ${hexAlpha(node.fill, 0.25)}`;

  txt.style.fontFamily = node.font;
  txt.style.fontSize = node.fontSize + 'px';
  txt.style.fontWeight = node.bold ? '700' : '400';
  txt.style.fontStyle = node.italic ? 'italic' : 'normal';
  txt.style.textDecoration = node.underline ? 'underline' : 'none';
  txt.style.color = node.textColor;
  txt.innerText = node.text;

  if (node.done) el.classList.add('done');
  else el.classList.remove('done');

  if (node.shape === 'diamond') txt.style.padding = '14px 20px';
  else if (node.shape === 'heart' || node.shape === 'star') txt.style.padding = '16px 12px';
  else txt.style.padding = '10px 18px';
}

function updateNodeSize(node) {
  const el = document.getElementById('node-' + node.id);
  if (!el) return;
  const inner = el.querySelector('.node-inner');
  const bg = el.querySelector('.node-bg');
  inner.style.width = '';
  inner.style.height = '';

  requestAnimationFrame(() => {
    const w = inner.offsetWidth;
    const h = inner.offsetHeight;
    bg.style.width = w + 'px';
    bg.style.height = h + 'px';
    if (node.shape === 'diamond') {
      bg.style.width = w + 'px';
      bg.style.height = w + 'px';
    }
    if (node.shape === 'oval' || node.shape === 'heart' || node.shape === 'star') {
      const s = Math.max(w, h) * 1.1;
      bg.style.width = s + 'px';
      bg.style.height = s + 'px';
    }
    updateLines();
  });
}

function positionNode(node) {
  const el = document.getElementById('node-' + node.id);
  if (!el) return;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
}

// ════════════════════════════════════════════
//  WAVY LINES
// ════════════════════════════════════════════
function updateLines() {
  linesEl.innerHTML = '';
  state.links.forEach(link => {
    const nodeA = state.nodes.find(n => n.id === link.from);
    const nodeB = state.nodes.find(n => n.id === link.to);
    if (!nodeA || !nodeB) return;

    const elA = document.getElementById('node-' + nodeA.id);
    const elB = document.getElementById('node-' + nodeB.id);
    if (!elA || !elB) return;

    const x1 = nodeA.x + elA.querySelector('.node-inner').offsetWidth / 2;
    const y1 = nodeA.y + elA.querySelector('.node-inner').offsetHeight / 2;
    const x2 = nodeB.x + elB.querySelector('.node-inner').offsetWidth / 2;
    const y2 = nodeB.y + elB.querySelector('.node-inner').offsetHeight / 2;

    drawWavy(x1, y1, x2, y2, nodeB.lineColor || '#57d4ff', link.from, link.to);
  });
}

function drawWavy(x1, y1, x2, y2, color, fromId, toId) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const nx = -dy / dist;
  const ny = dx / dist;
  const amp = Math.min(dist * 0.18, 40);

  const cp1x = x1 + dx * 0.25 + nx * amp;
  const cp1y = y1 + dy * 0.25 + ny * amp;
  const cp2x = x1 + dx * 0.75 - nx * amp;
  const cp2y = y1 + dy * 0.75 - ny * amp;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
  path.setAttribute('class', 'wavy-line');
  
  const gradId = 'grad-' + Math.random().toString(36).slice(2, 7);
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  grad.setAttribute('id', gradId);
  grad.setAttribute('gradientUnits', 'userSpaceOnUse');
  grad.setAttribute('x1', x1); grad.setAttribute('y1', y1);
  grad.setAttribute('x2', x2); grad.setAttribute('y2', y2);

  const stops = [
    {offset: '0%', opacity: '0.25'},
    {offset: '50%', opacity: '0.9'},
    {offset: '100%', opacity: '0.25'}
  ];
  stops.forEach(s => {
    const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
    stop.setAttribute('offset', s.offset);
    stop.setAttribute('stop-color', color);
    stop.setAttribute('stop-opacity', s.opacity);
    grad.appendChild(stop);
  });
  defs.appendChild(grad);
  linesEl.appendChild(defs);

  path.setAttribute('stroke', `url(#${gradId})`);
  path.addEventListener('click', (e) => {
    if (state.removeLinkMode) {
      e.stopPropagation();
      removeLink(fromId, toId);
    }
  });

  const totalLen = dist * 1.15;
  path.style.strokeDasharray = `${totalLen}`;
  path.style.strokeDashoffset = `${totalLen}`;
  path.style.animation = `dashIn 0.5s ease forwards`;
  linesEl.appendChild(path);
}

// ════════════════════════════════════════════
//  INTERACTION & MODES
// ════════════════════════════════════════════
function removeLink(fromId, toId) {
  state.links = state.links.filter(l => !(l.from === fromId && l.to === toId));
  updateLines();
}

function removeNode(id) {
  const idx = state.nodes.findIndex(n => n.id === id);
  if (idx === -1) return;
  state.nodes.splice(idx, 1);
  state.links = state.links.filter(l => l.from !== id && l.to !== id);
  const el = document.getElementById('node-' + id);
  if (el) {
    el.style.animation = 'nodeRemove 0.2s ease forwards';
    setTimeout(() => el.remove(), 200);
  }
  updateLines();
}

// ════════════════════════════════════════════
//  DRAG & PAN
// ════════════════════════════════════════════
function onNodeMouseDown(e) {
  // 1. Abbruch bei Menüs oder Spezialmodi
  if (e.target.closest('.node-controls') || state.taskMode || state.removeMode) return;

  const el = e.currentTarget;
  const node = state.nodes.find(n => 'node-' + n.id === el.id);
  if (!node) return;

  // 2. DER FIX: Wenn auf Text geklickt wird, KEIN preventDefault.
  // Das erlaubt dem Browser, den Cursor in den Text zu setzen.
  if (!e.target.classList.contains('node-text')) {
    e.preventDefault(); 
  }

  e.stopPropagation();

  const canvasRect = canvasWrap.getBoundingClientRect();
  dragNode = node;

  // Koordinaten-Berechnung (wie gehabt)
  const mouseCanvasX = (e.clientX - canvasRect.left) / state.zoom - state.panX;
  const mouseCanvasY = (e.clientY - canvasRect.top) / state.zoom - state.panY;
  
  dragOffX = mouseCanvasX - node.x;
  dragOffY = mouseCanvasY - node.y;

  el.classList.add('dragging');
}

document.addEventListener('mousemove', (e) => {
  if (dragNode) {
  const canvasRect = canvasWrap.getBoundingClientRect();
  // Präzise Berechnung ohne Viewport-Abhängigkeit
  dragNode.x = (e.clientX - canvasRect.left) / state.zoom - state.panX - dragOffX;
  dragNode.y = (e.clientY - canvasRect.top) / state.zoom - state.panY - dragOffY;
  
  positionNode(dragNode);
  updateLines();
}
 else if (state.isPanning) {
    state.panX = state.panOriginX + (e.clientX - state.panStartX) / state.zoom;
    state.panY = state.panOriginY + (e.clientY - state.panStartY) / state.zoom;
    applyTransform();
  }
});

document.addEventListener('mouseup', () => {
  if (dragNode) document.getElementById('node-' + dragNode.id)?.classList.remove('dragging');
  dragNode = null;
  state.isPanning = false;
  canvasWrap.style.cursor = 'default';
});

canvasWrap.addEventListener('mousedown', (e) => {
  if (e.target !== canvasWrap && e.target !== canvasEl && e.target !== linesEl) return;
  state.isPanning = true;
  state.panStartX = e.clientX; state.panStartY = e.clientY;
  state.panOriginX = state.panX; state.panOriginY = state.panY;
  canvasWrap.style.cursor = 'grabbing';
});

canvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.08 : 0.93;
  const newZoom = Math.min(2.5, Math.max(0.25, state.zoom * zoomFactor));
  const rect = canvasWrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  state.panX -= mx / state.zoom - mx / newZoom;
  state.panY -= my / state.zoom - my / newZoom;
  state.zoom = newZoom;
  applyTransform();
}, { passive: false });

function applyTransform() {
  canvasEl.style.transform = `translate(${state.panX * state.zoom}px, ${state.panY * state.zoom}px) scale(${state.zoom})`;
}

function updateCanvas() { applyTransform(); updateLines(); }

// ════════════════════════════════════════════
//  BUTTONS
// ════════════════════════════════════════════
addBtn.addEventListener('click', () => {
  const center = state.nodes.find(n => n.isCenter);
  const angle = Math.random() * Math.PI * 2, radius = 220 + Math.random() * 100;
  let x, y;
  if (center) {
    const cEl = document.getElementById('node-' + center.id);
    const w = cEl?.querySelector('.node-inner').offsetWidth || 100, h = cEl?.querySelector('.node-inner').offsetHeight || 40;
    x = center.x + w/2 + Math.cos(angle) * radius - 60;
    y = center.y + h/2 + Math.sin(angle) * radius - 20;
  } else {
    x = (canvasWrap.offsetWidth/2)/state.zoom - state.panX - 60;
    y = (canvasWrap.offsetHeight/2)/state.zoom - state.panY - 20;
  }

  const node = createNode({ x, y, text: 'Gedanke', shape: state.shape, fill: state.fillColor, lineColor: state.lineColor, textColor: state.textColor, font: state.font, fontSize: state.fontSize, bold: state.bold, italic: state.italic, underline: state.underline });


  setTimeout(() => {
    const txt = document.getElementById('node-' + node.id)?.querySelector('.node-text');
    if (txt) { txt.focus(); selectAll(txt); }
    updateLines();
  }, 50);
});

function selectAll(el) {
  const range = document.createRange(); range.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
}

document.querySelectorAll('.shape-btn').forEach(btn => btn.addEventListener('click', () => {

}));

['fill', 'line', 'text'].forEach(type => {

document.getElementById('btn-task').addEventListener('click', () => {

document.getElementById('btn-remove').addEventListener('click', () => {

});

document.getElementById('btn-connect').addEventListener('click', () => {

  updateToolbarUI('btn-connect', '🔗 VERBINDUNGS-MODUS AKTIV', 'var(--accent3)');
});

document.getElementById('btn-remove-link').addEventListener('click', () => {
  state.removeLinkMode = !state.removeLinkMode; state.taskMode = false; state.removeMode = false; state.connectMode = false;

});

function updateToolbarUI(activeId, text, color) {
  const ids = ['btn-task', 'btn-remove', 'btn-connect', 'btn-remove-link'];
  ids.forEach(id => document.getElementById(id).classList.toggle('active', id === activeId && state[id.replace('btn-', '') + 'Mode']));
  const activeMode = state[activeId.replace('btn-', '') + 'Mode'];
  taskBadge.classList.toggle('visible', activeMode);
  taskBadge.textContent = text; taskBadge.style.background = color;
  canvasWrap.style.cursor = activeMode ? 'crosshair' : 'default';
}

document.getElementById('btn-reset-view').addEventListener('click', () => { state.panX = 0; state.panY = 0; state.zoom = 1; applyTransform(); });

// Color Popup Logic (Simplified)
function openPopup(target, currentColor, anchorEl) {
  popupTarget = target;
  document.getElementById('popup-title').textContent = target === 'fill' ? 'Füllfarbe' : target === 'line' ? 'Linienfarbe' : 'Textfarbe';
  document.getElementById('popup-wheel').value = currentColor;
  document.getElementById('popup-hex').value = currentColor;
  const popup = document.getElementById('color-popup');
  popup.classList.add('visible');
  const rect = anchorEl.getBoundingClientRect();
  popup.style.left = rect.left + 'px'; popup.style.top = (rect.bottom + 8) + 'px';
}

['fill', 'line', 'text'].forEach(t => {
  document.getElementById('swatch-' + t).addEventListener('click', (e) => {
    if (e.target.tagName !== 'INPUT') openPopup(t, state[t + 'Color'], document.getElementById('swatch-' + t));
  });
});

document.getElementById('popup-apply').addEventListener('click', () => {
  applyPopupColor(document.getElementById('popup-hex').value);
  document.getElementById('color-popup').classList.remove('visible');
});

document.getElementById('btn-save-png').addEventListener('click', () => {
  const canvasElement = document.getElementById('canvas');
  
  if (state.nodes.length === 0) {
    alert("Keine Elemente zum Exportieren vorhanden.");
    return;
  }

  // 1. Die äußersten Punkte (Bounding Box) berechnen
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  
  state.nodes.forEach(node => {
    const el = document.getElementById('node-' + node.id);
    // Wir nehmen die echte Breite/Höhe des Elements inkl. Padding
    const w = el ? el.offsetWidth : 150; 
    const h = el ? el.offsetHeight : 80;
    
    if (node.x < minX) minX = node.x;
    if (node.y < minY) minY = node.y;
    if (node.x + w > maxX) maxX = node.x + w;
    if (node.y + h > maxY) maxY = node.y + h;
  });

  // 2. Rand hinzufügen (30px)
  const padding = 30;
  const exportX = minX - padding;
  const exportY = minY - padding;
  const exportWidth = (maxX - minX) + (padding * 2);
  const exportHeight = (maxY - minY) + (padding * 2);

  // 3. Zoom/Pan temporär für den Snapshot deaktivieren
  const oldTransform = canvasElement.style.transform;
  canvasElement.style.transform = 'none';

  // 4. Export mit exaktem Ausschnitt
  html2canvas(canvasElement, {
    backgroundColor: null,
    scale: 2,             // Hohe Auflösung
    x: exportX,           // Startpunkt X
    y: exportY,           // Startpunkt Y
    width: exportWidth,   // Breite des Ausschnitts
    height: exportHeight, // Höhe des Ausschnitts
    logging: false,
    useCORS: true
  }).then(exportCanvas => {
    // Ansicht wiederherstellen
    canvasElement.style.transform = oldTransform;

    // Download
    const link = document.createElement('a');
    link.download = 'mindmap-ausschnitt.png';
    link.href = exportCanvas.toDataURL('image/png');
    link.click();
  }).catch(err => {
    console.error("Export fehlgeschlagen:", err);
    canvasElement.style.transform = oldTransform;
  });
});

function applyPopupColor(color) {
  if (!/^#[0-9a-fA-F]{6}$/.test(color)) return;
  state[popupTarget + 'Color'] = color;
  document.getElementById('swatch-' + popupTarget + '-preview').style.background = color;
  document.getElementById('inp-' + popupTarget).value = color;
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}


const styleAnim = document.createElement('style');
styleAnim.textContent = `@keyframes dashIn { to { stroke-dashoffset: 0; } } @keyframes nodeRemove { to { opacity: 0; transform: scale(0.8); } }`;
document.head.appendChild(styleAnim);

window.addEventListener('resize', updateLines);
window.addEventListener('load', () => setTimeout(init, 100));
